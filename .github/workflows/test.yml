name: test

# 只跑不碰硬件的部分：语法、离线逻辑单测、编译打包 + 产物自检。
# EC 相关的端到端验证必须在一台真的拯救者上跑（tools/smoke.ps1 等），CI 里没有那个硬件。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编码检查（PowerShell 5.1 在中文系统上按 GBK 读无 BOM 文件）
        shell: powershell
        run: |
          # Inline instead of calling tools\fix-encoding.ps1: the annotation below tells us
          # exactly which file the runner is unhappy about (a bare nested exit code does not).
          $ErrorActionPreference = 'Continue'
          $exts = @('.ps1', '.psm1', '.psd1', '.cs')
          $all = @(Get-ChildItem -LiteralPath . -Recurse -File -ErrorAction SilentlyContinue |
                   Where-Object { $exts -contains $_.Extension })
          $bad = @($all | Where-Object {
              $b = [IO.File]::ReadAllBytes($_.FullName)
              -not ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF)
            })
          $base = (Get-Location).Path.Length + 1
          Write-Host ("::notice::UTF-8 BOM check: {0} source file(s) scanned, {1} missing BOM" -f $all.Count, $bad.Count)
          foreach ($f in $bad) { Write-Host ("::error file={0}::源文件缺少 UTF-8 BOM" -f $f.FullName.Substring($base)) }
          if ($bad.Count) { exit 1 }

      - name: 语法检查
        shell: powershell
        run: |
          $files = @('src/LenovoFan.psm1','src/fanctl.ps1','src/daemon.ps1','src/panel.ps1','src/menu.ps1','install.ps1','uninstall.ps1','build/build.ps1') +
                   (Get-ChildItem tools\*.ps1 | ForEach-Object { $_.FullName -replace [regex]::Escape((Get-Location).Path + '\'), '' })
          $out = & tools\syntax.ps1 -Files $files
          $out | ForEach-Object { Write-Host $_ }
          if (($out | Select-String '^FAIL').Count -gt 0) { throw '语法检查未通过' }

      - name: 离线逻辑单测
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\unit-tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'unit tests failed' }

      - name: 编译并打包
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File build\build.ps1 2>&1 | Out-String
          $code = $LASTEXITCODE
          ($out -split "`r?`n" | Where-Object { $_.Trim() }) | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $bad = (@($out -split "`r?`n" | Where-Object { $_ -match 'FAIL|selftest|错误|Exception' }) -join ' ~ ')
            if ($bad.Length -gt 900) { $bad = $bad.Substring(0, 900) }
            Write-Host ("::error::build.ps1 退出码 {0}：{1}" -f $code, $bad)
            exit 1
          }

      - name: 产物自检（不接触硬件）
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $exe = Get-ChildItem dist -Recurse -Filter LegionFanStudio.exe | Select-Object -First 1
          if (-not $exe) { Write-Host '::error::dist 里找不到 LegionFanStudio.exe'; exit 1 }
          $v = & $exe.FullName --version 2>&1 | Out-String
          Write-Host ("::notice::--version exit={0} :: {1}" -f $LASTEXITCODE, $v.Trim())
          $t = & $exe.FullName --selftest 2>&1 | Out-String
          $te = $LASTEXITCODE
          ($t -split "`r?`n" | Where-Object { $_.Trim() }) | ForEach-Object { Write-Host "  $_" }
          if ($te -ne 0) {
            Write-Host ("::error::selftest 退出码 {0}，失败行：{1}" -f $te, (($t -split "`r?`n" | Where-Object { $_ -match 'FAIL' }) -join ' | '))
            exit 1
          }
          # 没有守护进程时 --status 应返回 2，而不是崩溃
          $s = & $exe.FullName --status 2>&1 | Out-String
          $se = $LASTEXITCODE
          Write-Host ("--status exit={0} :: {1}" -f $se, $s.Trim())
          if ($se -ne 2) { Write-Host ("::error::期望 --status 在没有守护进程时返回 2，实际 {0}（输出：{1}）" -f $se, $s.Trim()); exit 1 }
          Write-Host '::notice::产物自检通过（selftest 0 / --status 2）'

      - uses: actions/upload-artifact@v4
        with:
          name: LegionFanStudio
          path: dist/*.zip
