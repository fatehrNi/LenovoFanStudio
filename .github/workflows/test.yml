name: test

# 只跑不碰硬件的部分：语法、离线逻辑单测、编译打包 + 产物自检。
# EC 相关的端到端验证必须在一台真的拯救者上跑（tools/smoke.ps1 等），CI 里没有那个硬件。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编码检查（PowerShell 5.1 在中文系统上按 GBK 读无 BOM 文件）
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\fix-encoding.ps1 -DryRun
          if ($LASTEXITCODE -ne 0) { throw '有源文件不是 UTF-8 with BOM，请先跑 tools\fix-encoding.ps1' }

      - name: 语法检查
        shell: powershell
        run: |
          $files = @('src/LenovoFan.psm1','src/fanctl.ps1','src/daemon.ps1','src/panel.ps1','src/menu.ps1','install.ps1','uninstall.ps1','build/build.ps1') +
                   (Get-ChildItem tools\*.ps1 | ForEach-Object { $_.FullName -replace [regex]::Escape((Get-Location).Path + '\'), '' })
          $out = & tools\syntax.ps1 -Files $files
          $out | ForEach-Object { Write-Host $_ }
          if (($out | Select-String '^FAIL').Count -gt 0) { throw '语法检查未通过' }

      - name: 离线逻辑单测
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\unit-tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'unit tests failed' }

      - name: 编译并打包
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build\build.ps1

      - name: 产物自检（不接触硬件）
        shell: powershell
        run: |
          $exe = Get-ChildItem dist -Recurse -Filter LegionFanStudio.exe | Select-Object -First 1
          & $exe.FullName --version
          & $exe.FullName --selftest
          if ($LASTEXITCODE -ne 0) { throw "selftest failed ($LASTEXITCODE)" }
          # --status 在没有守护进程时应返回 2，而不是崩溃
          & $exe.FullName --status
          if ($LASTEXITCODE -ne 2) { throw "expected exit 2 with no daemon, got $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: LegionFanStudio
          path: dist/*.zip
